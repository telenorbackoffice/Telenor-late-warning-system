<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Late Login Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#1c2630;--mute:#5d6b78;--line:#d9dfe5;--bg:#eef1f4;--panel:#fff;--accent:#1f4e8c;--late:#b3261e;--warn:#a85f00;--ok:#1b6e43}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600;flex:1}
main{max-width:1080px;margin:0 auto;padding:18px}
nav{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
nav button{border:0;background:#dfe5ea;padding:9px 16px;border-radius:6px 6px 0 0;font:inherit;cursor:pointer;color:var(--mute)}
nav button.on{background:var(--panel);color:var(--ink);font-weight:600}
.panel{background:var(--panel);border-radius:0 8px 8px 8px;padding:18px;overflow-x:auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
button,input,textarea{font:inherit}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input[type=date]{width:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:13px;font-weight:600}
.tag.late{background:#fbe4e2;color:var(--late)}.tag.ok{background:#dff1e7;color:var(--ok)}.tag.warn{background:#fdecd2;color:var(--warn)}
.mute{color:var(--mute);font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;display:none;max-width:90vw}
#toast.err{background:var(--late)}
dialog{border:0;border-radius:10px;padding:22px;width:min(360px,92vw)}
dialog label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mute)}
details summary{cursor:pointer;color:var(--accent)}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Late Login Portal</h1>
  <span id="who" class="mute" style="color:#c5d0da"></span>
  <button class="btn alt" id="loginBtn">Backoffice login</button>
</header>
<main>
  <nav>
    <button data-tab="att" class="on">Daily attendance</button>
    <button data-tab="per">Pay period lates</button>
    <button data-tab="emp" class="admin hide">Employee emails</button>
  </nav>
  <div class="panel" id="panel"></div>
</main>
<div id="toast"></div>
<dialog id="dlg">
  <form method="dialog" id="loginForm">
    <strong>Backoffice login</strong>
    <label>Username</label><input id="lu" autocomplete="username">
    <label>Password</label><input id="lp" type="password" autocomplete="current-password">
    <div class="row" style="margin:16px 0 0"><button class="btn" value="ok">Log in</button><button class="btn alt" value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s), pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const now = new Date();
let date = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`, tab = "att";
let auth = null;
try { auth = JSON.parse(sessionStorage.getItem("auth") || "null"); } catch (e) {}
let empList = [];

function toast(m, err) { const t = $("#toast"); t.textContent = m; t.className = err ? "err" : ""; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 4500); }
async function api(path, body) {
  const h = { "content-type": "application/json" };
  if (auth) { h["x-user"] = auth.u; h["x-pass"] = auth.p; }
  const r = await fetch("/api/" + path, { method: body ? "POST" : "GET", headers: h, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
const t12 = t => { let [h, m] = t.split(":").map(Number); const p = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${pad(m)} ${p}`; };
const dl = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });

function normTime(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") { const m = Math.round((v % 1) * 1440); return pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60); }
  const m = String(v).trim().match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?/);
  if (!m) return null;
  let h = +m[1];
  if (m[3]) { const pm = m[3].toLowerCase() === "pm"; if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
  return pad(h) + ":" + m[2];
}
const clean = v => String(v ?? "").replace(/[\u00a0\u200b]/g, " ").replace(/\s+/g, " ").trim();
async function readSheet(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
  const a = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
  // The real header row may sit below a title row (e.g. "Employee Login Details as on… (11/09/2026)")
  let hi = a.findIndex(r => /global|clock|e-?mail/i.test(r.map(clean).join("|")));
  if (hi < 0) hi = 0;
  const H = a[hi].map((h, i) => clean(h) || "col" + i);
  const rows = a.slice(hi + 1).map(r => Object.fromEntries(H.map((h, i) => [h, r[i] ?? ""])));
  // Date from the title row, read as MM/DD/YYYY
  for (const r of a.slice(0, hi)) {
    const m = r.join(" ").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) { rows.titleDate = `${m[3]}-${pad(m[1])}-${pad(m[2])}`; break; }
  }
  return rows;
}
const col = (row, ...keys) => { const k = Object.keys(row).find(k => keys.some(x => k.toLowerCase().includes(x))); return k ? row[k] : ""; };

function setAuthUI() {
  document.querySelectorAll(".admin").forEach(e => e.classList.toggle("hide", !auth));
  $("#who").textContent = auth ? "Backoffice: " + auth.u : "";
  $("#loginBtn").textContent = auth ? "Log out" : "Backoffice login";
}
$("#loginBtn").onclick = () => {
  if (auth) { auth = null; sessionStorage.removeItem("auth"); if (tab === "emp") tab = "att"; setAuthUI(); show(); return; }
  $("#dlg").showModal();
};
$("#loginForm").onsubmit = async e => {
  if (e.submitter?.value !== "ok") return;
  const a = { u: $("#lu").value.trim(), p: $("#lp").value };
  try { auth = a; await api("login", {}); sessionStorage.setItem("auth", JSON.stringify(a)); setAuthUI(); show(); toast("Logged in"); }
  catch (er) { auth = null; toast("Login failed: " + er.message, true); }
  $("#lp").value = "";
};
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; show(); });

async function show() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const p = $("#panel");
  p.innerHTML = '<span class="mute">Loading…</span>';
  try { await ({ att: viewAtt, per: viewPer, emp: viewEmp })[tab](p); } catch (e) { p.innerHTML = `<span class="tag late">${esc(e.message)}</span>`; }
}
const dateBar = () => `<div class="row"><label>Date <input type="date" id="dsel" value="${date}"></label></div>`;
const bindDate = () => $("#dsel").onchange = e => { if (e.target.value) { date = e.target.value; show(); } };

async function viewAtt(p) {
  const { rows } = await api("attendance?date=" + date);
  p.innerHTML = dateBar() + (auth ? `<div class="row"><label class="btn alt">Upload attendance for ${dl(date)}<input type="file" id="up" accept=".xlsx,.xls,.csv" class="hide"></label>
    <span class="mute">Columns: Store ID, Location, Employee Name, Global ID, Clock In Time. Re-uploading a date replaces it and keeps manual toggles.</span></div>` : "") +
    (rows.length ? `<table><tr><th>Store</th><th>Location</th><th>Employee</th><th>Global ID</th><th>Clock in</th><th>Status</th>${auth ? "<th></th>" : ""}</tr>` +
      rows.sort((a, b) => a.name.localeCompare(b.name)).map(r => `<tr><td>${esc(r.storeId)}</td><td>${esc(r.location)}</td><td>${esc(r.name)}</td><td>${esc(r.globalId)}</td><td>${t12(r.time)}</td>
      <td><span class="tag ${r.late ? "late" : "ok"}">${r.late ? "Late" : "On time"}</span>${r.override !== null && r.override !== undefined ? ' <span class="mute">manual</span>' : ""}</td>
      ${auth ? `<td><button class="btn alt" data-g="${esc(r.globalId)}" data-late="${!r.late}">Mark ${r.late ? "not late" : "late"}</button></td>` : ""}</tr>`).join("") + "</table>"
      : '<p class="mute">No attendance uploaded for this date.</p>');
  bindDate();
  p.querySelectorAll("[data-g]").forEach(b => b.onclick = async () => {
    try { await api("toggle", { date, globalId: b.dataset.g, late: b.dataset.late === "true" }); show(); } catch (e) { toast(e.message, true); }
  });
  const up = $("#up");
  if (up) up.onchange = async () => {
    try {
      const sheet = await readSheet(up.files[0]);
      const out = sheet.map(r => ({ storeId: clean(col(r, "store")), location: clean(col(r, "location")), name: clean(col(r, "employee", "name")), globalId: clean(col(r, "global")), time: normTime(col(r, "clock")) })).filter(r => r.globalId && r.time);
      if (!out.length) return toast("No valid rows found. Check the column names.", true);
      if (sheet.titleDate && sheet.titleDate !== date) {
        if (!confirm(`The file is dated ${dl(sheet.titleDate)} but ${dl(date)} is selected.\n\nOK = save to ${dl(sheet.titleDate)}\nCancel = stop`)) { up.value = ""; return; }
        date = sheet.titleDate;
      }
      if (!confirm(`Save ${out.length} rows for ${dl(date)}?`)) { up.value = ""; return; }
      const r = await api("upload", { date, rows: out });
      toast(`Saved ${r.saved} employees`); show();
    } catch (e) { toast(e.message, true); }
  };
}

async function viewPer(p) {
  const s = await api("summary?date=" + date);
  p.innerHTML = dateBar() + `<p><strong>Pay period ${dl(s.start)} to ${dl(s.end)}</strong><br><span class="mute">3 or more lates in a pay period loses half of the month's commission.</span></p>` +
    (s.rows.length ? `<table><tr><th>Employee</th><th>Lates</th><th>Details</th>${auth ? "<th>Warning email</th>" : ""}</tr>` + s.rows.map(r => `<tr>
      <td>${esc(r.name)}<div class="mute">${esc(r.globalId)}</div></td>
      <td><span class="tag ${r.count >= 3 ? "late" : r.count === 2 ? "warn" : "ok"}">${r.count}</span></td>
      <td><details><summary>View lates</summary>${r.items.map(i => `<div>${dl(i.date)} · ${esc(i.location)} (Store ${esc(i.storeId)}) · ${t12(i.time)}</div>`).join("")}</details></td>
      ${auth ? `<td>${r.count >= 2 ? (r.hasEmail ? `<button class="btn ${r.warned ? "alt" : ""}" data-send="${esc(r.globalId)}" data-name="${esc(r.name)}">${r.warned ? "Send again" : "Send warning"}</button>` : '<span class="mute">Add email first</span>') + (r.warned ? `<div class="mute">Last sent ${new Date(r.warned.at).toLocaleString()} (${r.warned.count} lates)</div>` : "") : '<span class="mute">Not yet</span>'}</td>` : ""}</tr>`).join("") + "</table>"
      : '<p class="mute">No lates in this pay period.</p>');
  bindDate();
  p.querySelectorAll("[data-send]").forEach(b => b.onclick = async () => {
    if (!confirm(`Email a late warning to ${b.dataset.name}? It will be CC'd as configured.`)) return;
    b.disabled = true;
    try { const r = await api("send-warning", { date, globalId: b.dataset.send }); toast(`Warning sent to ${r.to}`); show(); } catch (e) { toast(e.message, true); b.disabled = false; }
  });
}

async function viewEmp(p) {
  if (!auth) { p.innerHTML = '<p class="mute">Backoffice login required.</p>'; return; }
  const [list, st] = await Promise.all([api("employees"), api("settings")]);
  empList = list;
  p.innerHTML = `<div class="row"><button class="btn" id="save">Save emails</button><button class="btn alt" id="add">Add employee</button>
    <label class="btn alt">Import from Excel<input type="file" id="imp" accept=".xlsx,.xls,.csv" class="hide"></label>
    <span class="mute">Import columns: Global ID, Name, Email. Employees are added automatically when attendance is uploaded.</span></div>
    <div id="etab"></div>
    <h3 style="margin-top:26px">Warning email wording</h3>
    <p class="mute">Sent from ${esc(st.from)}, CC ${esc(st.cc)}. Placeholders: {name} {count} {periodStart} {periodEnd} {lateList} {consequence}. {lateList} fills in the date, location and login time of every late so far.</p>
    <label>Subject<input id="tsub" value="${esc(st.subject)}"></label>
    <label>Message<textarea id="tbody" rows="10">${esc(st.body)}</textarea></label>
    <div class="row" style="margin-top:12px"><button class="btn" id="tsave">Save wording</button></div>`;
  drawEmp();
  $("#add").onclick = () => { syncEmp(); empList.unshift({ globalId: "", name: "", email: "" }); drawEmp(); };
  $("#save").onclick = async () => { syncEmp(); try { const r = await api("employees", { list: empList }); toast(`Saved ${r.saved} employees`); } catch (e) { toast(e.message, true); } };
  $("#tsave").onclick = async () => { try { await api("settings", { subject: $("#tsub").value, body: $("#tbody").value }); toast("Wording saved"); } catch (e) { toast(e.message, true); } };
  $("#imp").onchange = async () => {
    try {
      syncEmp();
      const rows = await readSheet($("#imp").files[0]); let n = 0;
      rows.forEach(r => {
        const g = String(col(r, "global")).trim(), email = String(col(r, "email", "mail")).trim(); if (!g) return;
        const e = empList.find(x => x.globalId === g);
        if (e) { if (email) e.email = email; if (!e.name) e.name = col(r, "name"); } else empList.push({ globalId: g, name: col(r, "name"), email });
        n++;
      });
      drawEmp(); toast(`Imported ${n} rows. Click Save emails to keep them.`);
    } catch (e) { toast(e.message, true); }
  };
}
function drawEmp() {
  $("#etab").innerHTML = `<table><tr><th>Employee name</th><th>Global ID</th><th>Personal email</th></tr>` + empList.map(e =>
    `<tr><td><input data-f="name" value="${esc(e.name)}"></td><td><input data-f="globalId" value="${esc(e.globalId)}"></td><td><input data-f="email" type="email" value="${esc(e.email)}" placeholder="name@gmail.com"></td></tr>`).join("") + "</table>";
}
function syncEmp() { document.querySelectorAll("#etab tr").forEach((tr, i) => { if (!i) return; tr.querySelectorAll("input").forEach(inp => empList[i - 1][inp.dataset.f] = inp.value); }); }

setAuthUI(); show();
</script>
</body>
</html>
